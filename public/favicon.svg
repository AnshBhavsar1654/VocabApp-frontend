<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- WortSchatz — fern green ticket with warm accent -->
  <rect width="32" height="32" rx="7" fill="#15946A"/>
  <!-- stacked flashcard hint -->
  <rect x="7" y="9" width="18" height="13" rx="2.5" fill="white" opacity="0.96"/>
  <rect x="9.5" y="11.2" width="13" height="1.6" rx="0.8" fill="#F0DCC0"/>
  <rect x="9.5" y="14.2" width="9" height="1.6" rx="0.8" fill="#FFF0DC"/>
  <!-- W mark -->
  <text x="16" y="19.2" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="8.5" fill="#0F7653" letter-spacing="-0.3">W</text>
  <!-- marigold accent dot -->
  <circle cx="23.2" cy="7.5" r="2.8" fill="#F5A623" stroke="white" stroke-width="1.2"/>
  <text x="23.2" y="8.7" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="4.5" fill="#1B1815">ä</text>
</svg>
